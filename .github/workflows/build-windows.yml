name: Build FengShui M1 Native PyQt5 Windows

on:
  push:
    branches: [fengshui-pyqt5-v2]
    paths:
      - 'payload/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct native PyQt5 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem 'payload/fengshui_source.part*' | Sort-Object Name
          if ($parts.Count -ne 7) { throw "Expected 7 payload parts, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes('fengshui_source.zip', [Convert]::FromBase64String($b64))
          Expand-Archive -Path 'fengshui_source.zip' -DestinationPath 'fengshui_pyqt5_m1' -Force
          if (-not (Test-Path 'fengshui_pyqt5_m1/app.py')) { throw 'Source reconstruction failed' }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: fengshui_pyqt5_m1/requirements.txt

      - name: Install dependencies
        working-directory: fengshui_pyqt5_m1
        run: python -m pip install -r requirements.txt

      - name: Run core tests
        working-directory: fengshui_pyqt5_m1
        shell: pwsh
        run: |
          $env:PYTHONPATH = '.'
          python tests/test_core.py

      - name: Build native GUI and portable EXE
        working-directory: fengshui_pyqt5_m1
        run: |
          pyinstaller --noconfirm --clean FengShuiM1.spec
          pyinstaller --noconfirm --clean FengShuiM1_portable.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build per-user installer
        working-directory: fengshui_pyqt5_m1
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Collect and verify Windows files
        working-directory: fengshui_pyqt5_m1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item 'build\installer\慧缘风水分析实验室_M1_PyQt5_安装版.exe' release\
          Copy-Item 'dist\慧缘风水分析实验室M1_便携版.exe' release\
          Compress-Archive -Path 'dist\慧缘风水分析实验室M1\*' -DestinationPath 'release\慧缘风水分析实验室_M1_PyQt5_绿色版.zip'
          Get-FileHash release\* -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Set-Content release\SHA256.txt -Encoding UTF8
          Get-ChildItem release | Format-Table Name,Length

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: FengShuiM1-PyQt5-Windows
          path: fengshui_pyqt5_m1/release/*
          retention-days: 30
          if-no-files-found: error
